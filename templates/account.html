{{define "content"}}
<div class="narrow">
  <div class="page-head"><h1>Account</h1></div>
  <div class="card form-card">
    <h2>{{$u := .P.User}}Signed in as <strong>{{$u.DisplayName}}</strong> <span class="mono muted">({{$u.Username}})</span>
      <span class="chip">{{if $u.IsAdmin}}IT admin{{else}}User{{end}}</span></h2>
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf" value="{{.P.CSRF}}">
      <label class="field-label" for="p-current">Current password</label>
      <input class="input" id="p-current" type="password" name="current" required autocomplete="current-password">
      <label class="field-label" for="p-new">New password</label>
      <input class="input" id="p-new" type="password" name="password" required minlength="8" autocomplete="new-password">
      <div class="form-actions"><button class="btn btn-primary" type="submit">Change password</button></div>
    </form>
    <p class="muted small">Changing your password signs you out everywhere.</p>
    <form method="post" action="/account/email">
      <input type="hidden" name="csrf" value="{{.P.CSRF}}">
      <label class="field-label" for="e-address">Email for ticket notifications</label>
      <input class="input" id="e-address" type="email" name="email" value="{{$u.Email}}" placeholder="you@example.com" autocomplete="email">
      <div class="form-actions"><button class="btn" type="submit">Save email</button></div>
    </form>
    <p class="muted small">Leave blank to stop receiving ticket emails. Administrators can also set this for any account.</p>
  </div>
</div>
{{end}}
